name: CI/CD Web App

on:
  push:
    paths:
      - "services/web/**"
      - "deploy/dev/**"
      - ".github/workflows/ci-cd-web.yml"
      - ".github/workflows/servico.yml"
  workflow_dispatch:
    inputs:
      simular_falha_smoke_test:
        description: "Simular falha do smoke test (para demonstrar o rollback)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  web:
    uses: ./.github/workflows/servico.yml
    with:
      servico: web
      porta: 8003
      comando_lint: npm run lint
      comando_testes: npm test
      simular_falha: ${{ inputs.simular_falha_smoke_test == true }}
    secrets: inherit
