name: Teste do runner

on:
  push:
    paths:
      - '.github/workflows/teste-runner.yml'
  workflow_dispatch:

jobs:
  teste:
    runs-on: self-hosted
    steps:
      - name: Olá do runner
        run: |
          echo "Olá do runner"
          hostname

      - name: Docker acessível ao runner
        run: |
          docker version
          docker run --rm hello-world
