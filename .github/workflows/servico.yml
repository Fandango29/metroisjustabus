name: Pipeline de um serviço

on:
  workflow_call:
    inputs:
      servico:
        type: string
        required: true
      porta:
        type: number
        required: true
      simular_falha:
        type: boolean
        default: false
      # Comandos corridos na imagem de testes. Por omissão, os dos serviços Python.
      comando_lint:
        type: string
        default: ruff check .
      # Mede a cobertura da pasta app/ e falha abaixo de 70% (RNF-18)
      comando_testes:
        type: string
        default: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=70

env:
  IMAGEM: ghcr.io/fandango29/metroisjustabus-${{ inputs.servico }}
  IMAGEM_TESTES: metroisjustabus-${{ inputs.servico }}-testes:${{ github.sha }}
  PASTA: services/${{ inputs.servico }}

defaults:
  run:
    shell: bash

jobs:
  testes:
    name: Lint e testes
    runs-on: [self-hosted, dev]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar dependências (imagem de testes)
        run: docker build --target teste -t ${{ env.IMAGEM_TESTES }} ${{ env.PASTA }}

      - name: Lint (${{ inputs.comando_lint }})
        run: docker run --rm ${{ env.IMAGEM_TESTES }} ${{ inputs.comando_lint }}

      # A saída também fica num ficheiro, para o passo seguinte ler a cobertura
      # (o bash do Actions corre com pipefail: o tee não esconde a falha dos testes)
      - name: Testes (${{ inputs.comando_testes }})
        id: testes
        run: >-
          docker run --rm ${{ env.IMAGEM_TESTES }} ${{ inputs.comando_testes }}
          | tee "$RUNNER_TEMP/testes-${{ inputs.servico }}.log"

      # Corre também quando a cobertura fica abaixo do limite, para a percentagem aparecer
      - name: Cobertura no resumo do job
        if: always() && steps.testes.outcome != 'skipped'
        run: |
          # pytest-cov: linha "TOTAL ... 87%"; Vitest: coluna "% Stmts" da linha "All files | ..."
          cobertura=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/testes-${{ inputs.servico }}.log" \
            | awk '/^TOTAL / { print $NF }
                   /^All files/ { split($0, c, "|"); gsub(/ /, "", c[2]); print c[2] "%" }' \
            | tail -n 1)
          if [ -z "$cobertura" ]; then
            echo "::warning::Não foi possível ler a cobertura de testes de ${{ inputs.servico }}"
            exit 0
          fi
          echo "Cobertura de testes (${{ inputs.servico }}): $cobertura"
          echo "### Cobertura de testes (${{ inputs.servico }}): $cobertura (mínimo 70%)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remover imagem de testes
        if: always()
        continue-on-error: true
        run: docker rmi ${{ env.IMAGEM_TESTES }}

  imagem:
    name: Build e publicação da imagem
    needs: testes
    runs-on: [self-hosted, dev]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Build da imagem
        run: >-
          docker build
          --build-arg APP_COMMIT_SHA=${{ github.sha }}
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t ${{ env.IMAGEM }}:${{ github.sha }}
          ${{ env.PASTA }}

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem (etiqueta SHA)
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGEM }}:${{ github.sha }}

      - name: Etiquetar como dev-latest
        if: github.ref == 'refs/heads/main'
        run: docker tag ${{ env.IMAGEM }}:${{ github.sha }} ${{ env.IMAGEM }}:dev-latest

      - name: Publicar imagem (etiqueta dev-latest)
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGEM }}:dev-latest

  deploy-dev:
    name: Deploy em desenvolvimento
    needs: imagem
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dev]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy, smoke test e rollback
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BILHETES_DB_PASSWORD: ${{ secrets.BILHETES_DB_PASSWORD }}
          NOTIFICACOES_DB_PASSWORD: ${{ secrets.NOTIFICACOES_DB_PASSWORD }}
        run: >-
          ./deploy/dev/deploy.sh
          --servico ${{ inputs.servico }}
          --porta ${{ inputs.porta }}
          --imagem ${{ env.IMAGEM }}
          --sha ${{ github.sha }}
          ${{ inputs.simular_falha && '--simular-falha' || '' }}
