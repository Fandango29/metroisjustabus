name: CI/CD Bilhetes

on:
  push:
    paths:
      - "services/bilhetes/**"
      - "deploy/dev/**"
      - ".github/workflows/ci-cd-bilhetes.yml"
      - ".github/workflows/servico.yml"
  workflow_dispatch:
    inputs:
      simular_falha_smoke_test:
        description: "Simular falha do smoke test (para demonstrar o rollback)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  bilhetes:
    uses: ./.github/workflows/servico.yml
    with:
      servico: bilhetes
      porta: 8001
      simular_falha: ${{ inputs.simular_falha_smoke_test == true }}
    secrets: inherit
