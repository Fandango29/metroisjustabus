name: metroisjustabus-dev

services:
  core:
    # Na pipeline, CORE_IMAGE aponta para a imagem do GHCR com o SHA do commit.
    # Localmente, sem CORE_IMAGE, a imagem é construída a partir do código.
    image: ${CORE_IMAGE:-metroisjustabus-core:local}
    build:
      context: ../../services/core
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@core-db:5432/${POSTGRES_DB}
    depends_on:
      core-db:
        condition: service_healthy
    restart: unless-stopped

  bilhetes:
    # Na pipeline, BILHETES_IMAGE aponta para a imagem do GHCR com o SHA do commit.
    image: ${BILHETES_IMAGE:-metroisjustabus-bilhetes:local}
    build:
      context: ../../services/bilhetes
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://${BILHETES_DB_USER:-}:${BILHETES_DB_PASSWORD:-}@bilhetes-db:5432/${BILHETES_DB_NAME:-}
    depends_on:
      bilhetes-db:
        condition: service_healthy
    restart: unless-stopped

  notificacoes:
    # Na pipeline, NOTIFICACOES_IMAGE aponta para a imagem do GHCR com o SHA do commit.
    image: ${NOTIFICACOES_IMAGE:-metroisjustabus-notificacoes:local}
    build:
      context: ../../services/notificacoes
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    ports:
      - "8002:8000"
    environment:
      # Ainda não usado pelo código: fica pronto para as subscrições (onda 2).
      DATABASE_URL: postgresql://${NOTIFICACOES_DB_USER:-}:${NOTIFICACOES_DB_PASSWORD:-}@notificacoes-db:5432/${NOTIFICACOES_DB_NAME:-}
    depends_on:
      notificacoes-db:
        condition: service_healthy
    restart: unless-stopped

  core-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - core-db-dados:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bilhetes-db:
    # Base de dados só do Bilhetes: nenhum outro serviço a lê.
    image: postgres:16
    environment:
      # Valor vazio por omissão: nos deploys do Core e das Notificações estas variáveis podem
      # faltar no .env e o compose não pode falhar por isso.
      POSTGRES_USER: ${BILHETES_DB_USER:-}
      POSTGRES_PASSWORD: ${BILHETES_DB_PASSWORD:-}
      POSTGRES_DB: ${BILHETES_DB_NAME:-}
    volumes:
      - bilhetes-db-dados:/var/lib/postgresql/data
      - ./init-db-bilhetes:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notificacoes-db:
    # Base de dados só das Notificações: nenhum outro serviço a lê.
    image: postgres:16
    environment:
      # Valor vazio por omissão: nos deploys do Core e do Bilhetes estas variáveis podem faltar
      # no .env e o compose não pode falhar por isso.
      POSTGRES_USER: ${NOTIFICACOES_DB_USER:-}
      POSTGRES_PASSWORD: ${NOTIFICACOES_DB_PASSWORD:-}
      POSTGRES_DB: ${NOTIFICACOES_DB_NAME:-}
    volumes:
      - notificacoes-db-dados:/var/lib/postgresql/data
      - ./init-db-notificacoes:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.8-management
    # Nome de anfitrião fixo: o RabbitMQ guarda os dados por nome do nó (rabbit@<hostname>).
    # Sem isto, ao recriar o contentor, os dados do volume deixavam de ser usados.
    hostname: rabbitmq
    environment:
      # Valor vazio por omissão: o deploy.sh (e o deploy.ps1) só escrevem POSTGRES_* no .env
      # e o compose não pode falhar quando estas variáveis faltam.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev
    environment:
      # Administrador criado no primeiro arranque; valores só no .env.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  core-db-dados:
  bilhetes-db-dados:
  notificacoes-db-dados:
  rabbitmq-dados:
