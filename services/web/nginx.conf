# Configuração do nginx da Web App: serve os ficheiros estáticos gerados pelo Vite e
# responde em /health (RNF-12) e /version (RNF-17) como os outros serviços.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # version.json é gerado no build da imagem com o SHA do commit
    location = /version {
        default_type application/json;
        alias /usr/share/nginx/metro/version.json;
    }

    # Aplicação de página única: caminhos desconhecidos devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
